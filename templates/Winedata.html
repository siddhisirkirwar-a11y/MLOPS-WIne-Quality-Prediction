<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wine Quality Prediction</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <div class="container">

        <h1>Wine Quality Prediction</h1>

        <form method="post" action="/">

            <label for="fixed_acidity">
                Fixed Acidity:
            </label>
            <input
                type="number"
                step="0.01"
                id="fixed_acidity"
                name="fixed_acidity"
                required
            >


            <label for="volatile_acidity">
                Volatile Acidity:
            </label>
            <input
                type="number"
                step="0.01"
                id="volatile_acidity"
                name="volatile_acidity"
                required
            >


            <label for="citric_acid">
                Citric Acid:
            </label>
            <input
                type="number"
                step="0.01"
                id="citric_acid"
                name="citric_acid"
                required
            >


            <label for="residual_sugar">
                Residual Sugar:
            </label>
            <input
                type="number"
                step="0.01"
                id="residual_sugar"
                name="residual_sugar"
                required
            >


            <label for="chlorides">
                Chlorides:
            </label>
            <input
                type="number"
                step="0.001"
                id="chlorides"
                name="chlorides"
                required
            >


            <label for="free_sulfur_dioxide">
                Free Sulfur Dioxide:
            </label>
            <input
                type="number"
                step="0.01"
                id="free_sulfur_dioxide"
                name="free_sulfur_dioxide"
                required
            >


            <label for="total_sulfur_dioxide">
                Total Sulfur Dioxide:
            </label>
            <input
                type="number"
                step="0.01"
                id="total_sulfur_dioxide"
                name="total_sulfur_dioxide"
                required
            >


            <label for="density">
                Density:
            </label>
            <input
                type="number"
                step="0.0001"
                id="density"
                name="density"
                required
            >


            <label for="pH">
                pH:
            </label>
            <input
                type="number"
                step="0.01"
                id="pH"
                name="pH"
                required
            >


            <label for="sulphates">
                Sulphates:
            </label>
            <input
                type="number"
                step="0.01"
                id="sulphates"
                name="sulphates"
                required
            >


            <label for="alcohol">
                Alcohol (%):
            </label>
            <input
                type="number"
                step="0.01"
                id="alcohol"
                name="alcohol"
                required
            >


            <button type="submit">
                Predict Wine Quality
            </button>

        </form>


        <form method="get" action="/train">

            <button type="submit" class="train-button">
                Train Model
            </button>

        </form>


        {% if context %}

            <div class="result">
                <h2>
                    Result: {{ context }}
                </h2>
            </div>

        {% endif %}

    </div>

</body>

</html>
